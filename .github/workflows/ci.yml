name: RusaModels CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check rusamodels services migrations tests
      - name: Compile
        run: python -m compileall -q rusamodels services migrations tests
      - name: Tests
        run: pytest -q
      - name: Docker Compose validation
        run: |
          cp .env.example .env
          docker compose config --quiet
