name: Publish signed production images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require release commit to be reachable from main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Model Server image
        id: model
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          cache-from: type=gha,scope=model-server
          cache-to: type=gha,mode=max,scope=model-server
          tags: |
            ghcr.io/strategyg/rusamodels:${{ github.ref_name }}
            ghcr.io/strategyg/rusamodels:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/StrategyG/RusaModels
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max

      - name: Build and publish Quant Worker image
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.quant-worker
          platforms: linux/amd64
          push: true
          pull: true
          cache-from: type=gha,scope=quant-worker
          cache-to: type=gha,mode=max,scope=quant-worker
          tags: |
            ghcr.io/strategyg/rusamodels-quant-worker:${{ github.ref_name }}
            ghcr.io/strategyg/rusamodels-quant-worker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/StrategyG/RusaModels
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign immutable image digests
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/strategyg/rusamodels@${{ steps.model.outputs.digest }}"
          cosign sign "ghcr.io/strategyg/rusamodels-quant-worker@${{ steps.worker.outputs.digest }}"

      - name: Attest Model Server build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/strategyg/rusamodels
          subject-digest: ${{ steps.model.outputs.digest }}
          push-to-registry: true

      - name: Attest Quant Worker build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/strategyg/rusamodels-quant-worker
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true

      - name: Publish deployment digest summary
        run: |
          {
            echo "## Production image digests"
            echo
            echo "| Image | Immutable reference |"
            echo "|---|---|"
            echo "| Model Server | `ghcr.io/strategyg/rusamodels@${{ steps.model.outputs.digest }}` |"
            echo "| Quant Worker | `ghcr.io/strategyg/rusamodels-quant-worker@${{ steps.worker.outputs.digest }}` |"
          } >> "$GITHUB_STEP_SUMMARY"
