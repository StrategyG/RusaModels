name: Materialize RusaModels foundation

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/phase1.tar.gz.b64"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand reviewed source archive
        run: |
          python - <<'PY'
          import base64
          import io
          import tarfile
          from pathlib import Path

          archive_path = Path("bootstrap/phase1.tar.gz.b64")
          payload = base64.b64decode(archive_path.read_bytes(), validate=True)
          root = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
              archive.extractall(root, filter="data")
          archive_path.unlink()
          archive_path.parent.rmdir()
          PY
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap RusaModels Phase 1 platform foundation"
          git push
      - name: Run Phase 1 validation
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q rusamodels tests scripts
          pytest -q
          ruff check rusamodels tests scripts
          bandit -q -r rusamodels
          cp .env.example .env
          docker compose config --quiet
