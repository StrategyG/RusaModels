services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rusamodels}
      POSTGRES_USER: ${POSTGRES_USER:-rusamodels}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rusamodels_dev_only_change_me}
    volumes:
      - rusamodels-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rusamodels} -d ${POSTGRES_DB:-rusamodels}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rusamodels_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rusamodels_minio_dev_only_change_me}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - rusamodels-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rusamodels_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rusamodels_minio_dev_only_change_me}
      S3_BUCKET: ${S3_BUCKET:-rusamodels-artifacts}
    restart: "no"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      RUSAMODELS_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rusamodels}:${POSTGRES_PASSWORD:-rusamodels_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-rusamodels}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-rusamodels-artifacts}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-rusamodels_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-rusamodels_minio_dev_only_change_me}
      RUSAMODELS_API_PRINCIPALS: ${RUSAMODELS_API_PRINCIPALS:-{}}
      RUSAMODELS_SERVICE_TOKEN_SHA256: ${RUSAMODELS_SERVICE_TOKEN_SHA256:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  model-server:
    build: .
    command: ["uvicorn", "services.model_server.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  quant-server:
    build: .
    command: ["uvicorn", "services.quant_server.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports: ["8001:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  rusamodels-postgres:
  rusamodels-minio:
