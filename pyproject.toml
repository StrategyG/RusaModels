[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rusamodels"
version = "0.1.0"
description = "Independent model infrastructure platform for the RUSA-AI ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "huggingface_hub>=1.31,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["bandit>=1.7,<2", "httpx2>=2,<3", "pytest>=8.3,<9", "ruff>=0.11,<1", "PyYAML>=6,<7"]
quantization = [
  "accelerate>=1,<2",
  "safetensors>=0.4,<1",
  "torch>=2.4,<3",
  "transformers>=5.22.2,<6",
]
training = [
  "datasets>=3,<5",
  "peft>=0.21.2,<1",
  "torch>=2.4,<3",
  "transformers>=5.22.2,<6",
  "accelerate>=1,<2",
  "bitsandbytes>=0.46,<1",
  "PyYAML>=6,<7",
]
embeddings = [
  "sentence-transformers>=3,<6",
  "torch>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["rusamodels*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]
